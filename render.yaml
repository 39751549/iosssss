# ============ Render 免费部署配置 ============
# 用法：把项目推到 GitHub，在 Render 选 "New Web Service" 关联仓库即可
# 免费额度：512MB 内存，无流量费；缺点是 15 分钟无访问会休眠，冷启动约 40 秒
services:
  - type: web
    name: voice-room
    runtime: node
    plan: free
    region: singapore            # 国内访问相对近
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false               # 在 Render 面板里手工填写，不要写进代码
      - key: DATA_DIR
        value: /opt/render/project/src/data
